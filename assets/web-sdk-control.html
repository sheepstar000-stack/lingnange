<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵楠阁内容生成助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        select, input, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        select:focus, input:focus, textarea:focus {
            border-color: #667eea;
            outline: none;
        }
        select {
            background-color: white;
            cursor: pointer;
        }
        .workflow-select {
            font-size: 18px;
            padding: 15px;
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102,126,234,0.4);
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .result-box {
            margin-top: 20px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
            min-height: 100px;
        }
        .result-box h3 {
            margin-bottom: 10px;
            color: #333;
        }
        .result-content {
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.6;
        }
        .loading {
            text-align: center;
            color: #667eea;
        }
        .hidden {
            display: none;
        }
        .workflow-icon {
            font-size: 24px;
            margin-right: 10px;
        }
        .workflow-desc {
            font-size: 14px;
            color: #888;
            margin-top: 5px;
        }
        .section-title {
            background: #f0f0f0;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌲 灵楠阁内容生成助手</h1>
        
        <div class="form-group">
            <label>选择工作流类型</label>
            <select id="workflowType" class="workflow-select" onchange="updateWorkflowInfo()">
                <option value="">-- 请选择 --</option>
                <option value="热点选题">🔥 热点选题 - 根据热点日历生成选题</option>
                <option value="选题文案">📝 选题文案 - 根据选题生成发布文案</option>
                <option value="图片建议">🖼️ 图片建议 - 生成图片拍摄建议</option>
                <option value="内容整理">📋 内容整理 - 整理标题、正文、封面文案、图片建议、标签</option>
            </select>
            <div id="workflowDesc" class="workflow-desc"></div>
        </div>

        <div id="paramsSection" class="hidden">
            <div class="section-title">⚙️ 参数配置</div>
            
            <!-- 热点选题参数 -->
            <div id="hotTopicParams" class="hidden">
                <div class="form-group">
                    <label>热点日历表ID</label>
                    <input type="text" id="hotCalendarTableId" value="tblT1KM0397UcGeM" />
                </div>
                <div class="form-group">
                    <label>产品素材表ID</label>
                    <input type="text" id="productTableId" value="tbllExTlKURFJP2j" />
                </div>
                <div class="form-group">
                    <label>选题库表ID</label>
                    <input type="text" id="topicTableId" value="tblJNjx74uZ3s1vs" />
                </div>
            </div>

            <!-- 选题文案参数 -->
            <div id="topicPostParams" class="hidden">
                <div class="form-group">
                    <label>选题库表ID</label>
                    <input type="text" id="topicTableId2" value="tblJNjx74uZ3s1vs" />
                </div>
                <div class="form-group">
                    <label>内容成品库表ID</label>
                    <input type="text" id="contentTableId" value="tblg7zZuWKcUvqQX" />
                </div>
                <div class="form-group">
                    <label>筛选状态</label>
                    <input type="text" id="filterStatus" value="通过" placeholder="默认筛选"通过"状态的选题" />
                </div>
            </div>

            <!-- 图片建议参数 -->
            <div id="imageSuggestionParams" class="hidden">
                <div class="form-group">
                    <label>内容成品库表ID</label>
                    <input type="text" id="contentTableId2" value="tblg7zZuWKcUvqQX" />
                </div>
            </div>

            <!-- 内容整理参数 -->
            <div id="contentOrganizeParams" class="hidden">
                <div class="form-group">
                    <label>内容成品库表ID</label>
                    <input type="text" id="contentTableId3" value="tblg7zZuWKcUvqQX" />
                </div>
                <div class="form-group">
                    <label>筛选状态</label>
                    <input type="text" id="filterStatus2" value="待审核" placeholder="默认筛选"待审核"状态的内容" />
                </div>
                <div class="form-group">
                    <label>读取条数</label>
                    <input type="number" id="pageSize" value="5" placeholder="默认读取5条" />
                </div>
            </div>

            <!-- 公共参数 -->
            <div class="form-group">
                <label>飞书App Token</label>
                <input type="text" id="feishuAppToken" value="FoWqb7NLuah1gdssEHbc7Wk9nQh" />
            </div>
            
            <div class="form-group">
                <label>API Token（已内置）</label>
                <input type="text" id="apiToken" value="pat_SABjzimTwuZ9TrmGEnhLGUMnhC8kEfSgsQJzoFb1OZ2SBI4UnmV8zAYiAG4SCOWM" readonly style="background: #f0f0f0;" />
                <small style="color: #888; margin-top: 5px;">Token已内置，直接点击运行即可</small>
            </div>
        </div>

        <button id="runBtn" class="btn hidden" onclick="runWorkflow()">
            🚀 开始运行
        </button>

        <div id="resultBox" class="result-box hidden">
            <h3>📊 执行结果</h3>
            <div id="resultContent" class="result-content"></div>
        </div>
    </div>

    <script>
        const workflowDescriptions = {
            '热点选题': '读取热点日历和产品素材，生成选题建议写入选题库',
            '选题文案': '读取选题库中"通过"状态的选题，生成发布文案写入内容成品库',
            '图片建议': '读取内容成品库中"待审核"状态的内容，生成图片拍摄建议',
            '内容整理': '读取内容成品库，整理标题、正文、封面文案、图片建议、标签等'
        };

        function updateWorkflowInfo() {
            const workflowType = document.getElementById('workflowType').value;
            const descEl = document.getElementById('workflowDesc');
            const paramsSection = document.getElementById('paramsSection');
            const runBtn = document.getElementById('runBtn');
            
            // 隐藏所有参数区域
            document.getElementById('hotTopicParams').classList.add('hidden');
            document.getElementById('topicPostParams').classList.add('hidden');
            document.getElementById('imageSuggestionParams').classList.add('hidden');
            document.getElementById('contentOrganizeParams').classList.add('hidden');
            
            if (workflowType) {
                descEl.textContent = workflowDescriptions[workflowType];
                paramsSection.classList.remove('hidden');
                runBtn.classList.remove('hidden');
                
                // 显示对应参数区域
                if (workflowType === '热点选题') {
                    document.getElementById('hotTopicParams').classList.remove('hidden');
                } else if (workflowType === '选题文案') {
                    document.getElementById('topicPostParams').classList.remove('hidden');
                } else if (workflowType === '图片建议') {
                    document.getElementById('imageSuggestionParams').classList.remove('hidden');
                } else if (workflowType === '内容整理') {
                    document.getElementById('contentOrganizeParams').classList.remove('hidden');
                }
            } else {
                descEl.textContent = '';
                paramsSection.classList.add('hidden');
                runBtn.classList.add('hidden');
            }
        }

        async function runWorkflow() {
            const workflowType = document.getElementById('workflowType').value;
            if (!workflowType) {
                alert('请先选择工作流类型');
                return;
            }

            const appToken = document.getElementById('feishuAppToken').value;
            let params = {
                workflow_type: workflowType,
                feishu_app_token: appToken
            };

            // 根据工作流类型添加参数
            if (workflowType === '热点选题') {
                params.feishu_hot_calendar_table_id = document.getElementById('hotCalendarTableId').value;
                params.feishu_product_table_id = document.getElementById('productTableId').value;
                params.feishu_topic_table_id = document.getElementById('topicTableId').value;
            } else if (workflowType === '选题文案') {
                params.feishu_topic_table_id = document.getElementById('topicTableId2').value;
                params.feishu_content_table_id = document.getElementById('contentTableId').value;
                params.filter_status = document.getElementById('filterStatus').value;
            } else if (workflowType === '图片建议') {
                params.feishu_content_table_id = document.getElementById('contentTableId2').value;
            } else if (workflowType === '内容整理') {
                params.feishu_content_table_id = document.getElementById('contentTableId3').value;
                params.filter_status = document.getElementById('filterStatus2').value;
                params.page_size = parseInt(document.getElementById('pageSize').value) || 5;
            }

            const btn = document.getElementById('runBtn');
            const resultBox = document.getElementById('resultBox');
            const resultContent = document.getElementById('resultContent');
            
            btn.disabled = true;
            btn.textContent = '⏳ 正在运行...';
            resultBox.classList.remove('hidden');
            resultContent.innerHTML = '<div class="loading">工作流正在执行，请稍候...</div>';

            try {
                const apiToken = document.getElementById('apiToken').value;
                if (!apiToken) {
                    throw new Error('请输入API Token');
                }

                // 调用API
                const response = await fetch('https://jv7dr2vk3d.coze.site/run', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': apiToken.startsWith('Bearer ') ? apiToken : 'Bearer ' + apiToken
                    },
                    body: JSON.stringify(params)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`API错误: ${response.status} - ${errorText}`);
                }

                const result = await response.json();
                
                // 格式化显示结果
                resultContent.innerHTML = `
✅ 工作流执行完成！

<strong>工作流类型:</strong> ${workflowType}

<strong>执行结果:</strong>
${JSON.stringify(result, null, 2)}
`;
                
            } catch (error) {
                resultContent.innerHTML = `❌ 执行失败: ${error.message}`;
            }
            
            btn.disabled = false;
            btn.textContent = '🚀 开始运行';
        }
    </script>
</body>
</html>
